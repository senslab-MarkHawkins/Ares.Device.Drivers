# ARES Device Driver Manifest
# Target: CanaKit Relay (UK1104)

# Basic Metadata
device_type_name: "CanaKit UK1104 Relay"
driver_id: "canakit_uk1104_relay_v1"
connection_type: "Serial"

# The DLL that contains the CanaKitRelayDevice and ViewModel classes
assembly_name: "CanaKitRelay.dll"

# Serial connection specifics
serial_settings:
  requires_unit_id: false
  variable_baud_rate: false
  allowed_baud_rates: [9600, 19200, 38400, 57600, 115200]
  default_baud_rate: 115200

# Settings required when adding the device through the ARES UI
settings: []
