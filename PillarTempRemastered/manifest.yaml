# ARES Device Driver Manifest
# Target: Pillar Temperature PID Controller (Remastered)

# Basic Metadata
device_type_name: "Pillar Temperature PID"
driver_id: "pillartemp_remastered_v1"
connection_type: "None" # Computational device

# The DLL that contains the PillarTempDevice and ViewModel classes
assembly_name: "PillarTempRemastered.dll"

# Settings for the PID controller
settings:
  - key: "P"
    display_name: "Proportional Gain (Kp)"
    type: "number"
    default_value: 0.001346
    description: "The proportional gain constant."

  - key: "I"
    display_name: "Integral Gain (Ki)"
    type: "number"
    default_value: 0.00035
    description: "The integral gain constant."

  - key: "D"
    display_name: "Derivative Gain (Kd)"
    type: "number"
    default_value: 0.0
    description: "The derivative gain constant."

  - key: "MinOutput"
    display_name: "Minimum Output"
    type: "number"
    default_value: 0.01
    description: "The minimum allowed output value (e.g. Laser Power)."

  - key: "MaxOutput"
    display_name: "Maximum Output"
    type: "number"
    default_value: 2.0
    description: "The maximum allowed output value (e.g. Laser Power)."

  - key: "PastSignalsToAvg"
    display_name: "Signal Averaging Count"
    type: "number"
    default_value: 5
    description: "Number of past output signals to average."

  - key: "PastMeasurementsToAvg"
    display_name: "Measurement Averaging Count"
    type: "number"
    default_value: 1
    description: "Number of past measurements to average."
